name: cloud-skill-sync

on:
  pull_request:
    paths:
      - 'scripts/cloud-skill-sync/**'
      - 'plugins/mcp-issue-loop/hooks/session-start-umbraco.sh'
      - '.github/workflows/cloud-skill-sync-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cloud-skill-sync/**'
      - 'plugins/mcp-issue-loop/hooks/session-start-umbraco.sh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck + jq
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck jq

      - name: shellcheck (gate on errors)
        run: shellcheck --severity=error scripts/cloud-skill-sync/*.sh plugins/mcp-issue-loop/hooks/session-start-umbraco.sh

      - name: shellcheck (warnings, informational)
        run: shellcheck --severity=warning scripts/cloud-skill-sync/*.sh plugins/mcp-issue-loop/hooks/session-start-umbraco.sh || true

      - name: Hermetic tests
        run: bash scripts/cloud-skill-sync/test/run.sh
