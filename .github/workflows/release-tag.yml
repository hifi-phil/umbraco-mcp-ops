# Tags + publishes a GitHub Release when the marketplace version changes on
# main. Copied from
# plugins/release-flow/skills/release-and-branching/assets/release-tag.yml
# with two adjustments: reads .claude-plugin/marketplace.json
# (metadata.version, the repo's release version — see CLAUDE.md and the
# release-versioning skill), not a root package.json; and deploys the
# orchestrator once a release is published (deploy.yml, a reusable workflow:
# a release created with GITHUB_TOKEN doesn't trigger other workflows).
#
# Idempotent: computes v<version> from the manifest and skips if that tag
# already exists, so it only actually tags + releases when the version is
# bumped (i.e. once per real release, via auto-release-loop's Step 1 bump
# or a manual one).

name: release-tag

on:
  push:
    branches: [main]

permissions:
  contents: write # push tags + create releases

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.check.outputs.exists == 'false' }}
      tag: v${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can see whether the tag already exists

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./.claude-plugin/marketplace.json').metadata.version")" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag + GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.v.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" --title "$VERSION" --generate-notes

  deploy:
    needs: tag-and-release
    if: needs.tag-and-release.outputs.created == 'true'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.tag-and-release.outputs.tag }}
    secrets: inherit
