name: worker tests

# graph/'s and worker/'s tests and typechecks, on every PR that touches
# them. Deterministic and free (no LLM calls; that's worker-agent-evals.yml,
# on a release instead). See worker/README.md and CLAUDE.md.
#
# The repo is npm workspaces (the root package.json): one `npm ci` at the
# root installs graph/, worker/ and e2e/ from the one root lockfile, and
# links @orchestrator/graph (graph/) into the packages that import it.
# Each package then runs its own scripts.

on:
  pull_request:
    paths:
      - 'worker/**'
      - 'graph/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker-tests.yml'
  push:
    branches: [main, dev]
    paths:
      - 'worker/**'
      - 'graph/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22: the db tests use Node's built-in SQLite (node:sqlite, 22.5+).
          node-version: '22'

      - name: Install (all workspaces, from the root lockfile)
        run: npm ci

      - name: Test graph/
        working-directory: graph
        run: npm test

      - name: Typecheck graph/
        working-directory: graph
        run: npm run typecheck

      - name: Test worker/
        working-directory: worker
        run: npm test

      - name: Typecheck worker/
        working-directory: worker
        run: npm run typecheck
