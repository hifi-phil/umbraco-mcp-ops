# branch-housekeeping — sweep scope. THE single source of truth for which repos are
# swept and which branches are never touched. Both sweep.sh and reap.sh read this file;
# nothing else carries a repo list.
#
# Format, one repo per line:   OWNER/REPO|comma,separated,protected,branches
# Blank lines and #-comments are ignored.
#
# Protection here is the FIRST of three guards. sweep.sh also protects the repo's live
# default branch and any branch reporting GitHub branch protection. Don't rely on those
# two alone — see references/sweep-config.md for why (Editor has no protection at all).

umbraco/Umbraco-MCP-Base|main,dev
umbraco/Umbraco-CMS-MCP-Dev|main,dev,v16,v17/dev,v17/main,v18/dev
umbraco/Umbraco-CMS-MCP-Editor|main,dev,v17/dev,v17/main,v18/dev
